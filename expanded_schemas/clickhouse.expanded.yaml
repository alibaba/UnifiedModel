description:
  zh_cn: >-
    ClickHouse 存储，用于描述 ClickHouse 或其他 SQL 表后端的配置和查询规划信息。它通过 spec.family 路由到 sql-table 查询家族，把 get_metrics 渲染为 SQL。
  en_us: >-
    ClickHouse storage, used to define ClickHouse or other SQL-table backend metadata for query planning. It routes to the
    sql-table query family via spec.family, rendering get_metrics as SQL.
name: clickhouse
versions:
- name: v1.0.0
  spec:
    type: object
    properties:
      kind:
        type: string
        constraint:
          required: true
          enum:
            values:
            - clickhouse
      schema:
        type: object
        properties:
          url:
            description:
              zh_cn: Schema 的 URL。Core 部分都为 "umodel.aliyun.com"
              en_us: The url of the schema. The Core part is "umodel.aliyun.com"
            type: string
            constraint:
              required: true
          version:
            description:
              zh_cn: Schema 的版本。命名格式为 "v1.2.3"。
              en_us: The version of the schema. The format is "v1.2.3".
            type: string
            constraint:
              required: true
        constraint:
          required: true
      metadata:
        type: object
        properties:
          name:
            description:
              zh_cn: 元素在 UModel 系统中的名称。值不能为空。值格式为小写字母数字字符。
              en_us: >-
                The name of the Element in UModel System. The value cannot be empty.The value format is lowercase alphanumeric
                characters.
            type: string
            constraint:
              pattern: ^[a-zA-Z][a-zA-Z0-9-_\.]{0,127}$
              required: true
              min_len: 0
              max_len: 128
          display_name:
            description:
              zh_cn: 元素在 UModel 系统中的显示名称。值不能为空。
              en_us: The display name of the Element in UModel System. The value cannot be empty.
            type: object
            properties:
              zh_cn:
                description:
                  zh_cn: 中文描述
                  en_us: Chinese description
                type: string
              en_us:
                description:
                  zh_cn: 英文描述
                  en_us: English description
                type: string
          description:
            description:
              zh_cn: 元素在 UModel 系统中的描述。
              en_us: The description of the Element in UModel System.
            type: object
            properties:
              zh_cn:
                description:
                  zh_cn: 中文描述
                  en_us: Chinese description
                type: string
              en_us:
                description:
                  zh_cn: 英文描述
                  en_us: English description
                type: string
          short_description:
            description:
              zh_cn: 元素在 UModel系统中的简短描述。
              en_us: The short description of the Element in UModel System.
            type: object
            properties:
              zh_cn:
                description:
                  zh_cn: 中文描述
                  en_us: Chinese description
                type: string
              en_us:
                description:
                  zh_cn: 英文描述
                  en_us: English description
                type: string
          domain:
            description:
              zh_cn: 域。值格式为'domain.domain'。可以以点连接。
              en_us: >-
                The domain of the Field. The value format is 'domain.domain'. it can be connected in the form of a dot.
            type: string
            constraint:
              pattern: ^[A-Za-z][a-zA-Z0-9-_\\.]*$
              required: true
              min_len: 0
              max_len: 128
          launch_stage:
            description:
              zh_cn: 元素的发布阶段。默认值为 preview。
              en_us: The launch stage of the Element. The default value is preview.
            type: string
            constraint:
              enum:
                values:
                - preview
                - beta
                - ga
                - deprecated
              default_value: preview
          icon:
            description:
              zh_cn: 元素在UModel系统中的图标。值格式为'url'。
              en_us: The icon of the Element in UModel System. The value format is 'url'.
            type: string
            release_stage: experimental
            constraint: null
          uri:
            description:
              zh_cn: 用于表示该元素唯一标识。
              en_us: This field is used to represent the unique identifier of the Element.
            type: string
            release_stage: experimental
            constraint: null
          tags:
            description:
              zh_cn: 用于表示该元素的标签。
              en_us: This field is used to represent the tags of the Element.
            type: map
            constraint:
              map:
                min_size: 1
                key:
                  type: string
                  constraint: null
                value:
                  type: string
          properties:
            description:
              zh_cn: 用于表示该元素的附加属性。
              en_us: This field is used to represent the additional properties of the Element.
            type: map
            constraint:
              map:
                key:
                  type: string
                  constraint: null
                value:
                  type: string
          common_schema_info:
            type: object
            description:
              zh_cn: >
                背景：在阿里云可观测业务使用中，内置的UModel数据会作为公共UModel（CommonSchema）默认存在，公共UModel数据以引用方式（CommonSchemaRef）配置在UModel，在查询时动态生成UModel实例并附加该字段作为额外说明。
                使用方式：该字段不需要手动配置，仅供查看。若存在该字段，则说明对应的UModel实例只可查看，不支持编辑或删除；若不存在该字段，则可根据业务需求按需编辑。
              en_us: >
                Background: In the use of Alibaba Cloud Observability business, the built-in UModel data will be defaulted
                as a common UModel (CommonSchema), and the common UModel data will be configured as a reference (CommonSchemaRef)
                in the UModel. When querying, a UModel instance will be dynamically generated and the field will be added
                as an additional description.  Usage: This field does not need to be manually configured, and is only for
                viewing. If this field exists, it means that the corresponding UModel instance can only be viewed, and editing
                or deletion is not supported; if this field does not exist, it can be edited according to business needs.
            properties:
              group:
                type: string
                description:
                  zh_cn: CommonSchema的Group信息
                  en_us: The group of the common schema
              version:
                type: string
                description:
                  zh_cn: CommonSchema的版本号
                  en_us: The version of the common schema
        constraint:
          required: true
      spec:
        type: object
        constraint:
          required: true
        description:
          zh_cn: ClickHouse 的核心配置部分。UModel 只使用这些字段生成 SQL 查询计划，不直接执行查询，也不保存明文凭据。
          en_us: >-
            The specification section for ClickHouse. UModel uses these fields to generate SQL query plans only; it does not
            execute queries or store plaintext credentials.
        properties:
          family:
            description:
              zh_cn: >-
                该存储渲染所用的查询家族。设为 sql-table 即可经由 sql-table 渲染器把 get_metrics 渲染为 SQL；不设则该存储仅透传、不渲染。该家族此后的每个后端都只是配置。
              en_us: >-
                The query family this storage renders through. Set sql-table to render get_metrics as SQL via the sql-table
                renderer; omit it and the storage stays passthrough-only. Every backend in the family after the first is configuration
                only.
            type: string
          endpoint:
            description:
              zh_cn: ClickHouse 的访问地址，例如 http://clickhouse:8123。
              en_us: The endpoint URL of ClickHouse, for example http://clickhouse:8123.
            type: string
            constraint:
              required: true
          database:
            description:
              zh_cn: 查询所用的数据库名。
              en_us: The database name used for queries.
            type: string
          table:
            description:
              zh_cn: 指标所在的表名。sql-table 渲染器从该表 SELECT 数据。
              en_us: The table holding the metrics. The sql-table renderer SELECTs from this table.
            type: string
            constraint:
              required: true
          time_column:
            description:
              zh_cn: 时间列名，用于时间范围过滤与降采样。默认值为 timestamp。
              en_us: >-
                The time column used for time-range filtering and downsampling. Defaults to timestamp.
            type: string
            constraint:
              default_value: timestamp
          value_column:
            description:
              zh_cn: 指标数值列名。默认值为 value。
              en_us: The metric value column. Defaults to value.
            type: string
            constraint:
              default_value: value
          metric_column:
            description:
              zh_cn: 指标名所在的列名，用于按指标过滤。默认值为 metric_name。
              en_us: >-
                The column holding the metric name, used to filter by metric. Defaults to metric_name.
            type: string
            constraint:
              default_value: metric_name
          default_query_type:
            description:
              zh_cn: 默认查询类型。instant 表示取最新值，range 表示区间降采样。
              en_us: >-
                Default query type. instant returns the latest value, range downsamples over an interval.
            type: string
            constraint:
              enum:
                values:
                - instant
                - range
              default_value: range
          default_step:
            description:
              zh_cn: 区间查询的默认降采样步长，例如 60s、1m。
              en_us: Default downsampling step for range queries, for example 60s or 1m.
            type: string
          credential_ref:
            description:
              zh_cn: 凭据引用标识，例如 secret://clickhouse-prod-readonly。不得在 UModel 中保存明文用户名、密码或 Token。
              en_us: >-
                Credential reference, for example secret://clickhouse-prod-readonly. Plaintext usernames, passwords, or tokens
                must not be stored in UModel.
            type: string
          tls_verify:
            description:
              zh_cn: 是否校验 TLS 证书。默认值为 true。
              en_us: Whether TLS certificates should be verified. Defaults to true.
            type: boolean
            constraint:
              default_value: true
          properties:
            description:
              zh_cn: ClickHouse 的额外非敏感配置，以键值对形式存储。
              en_us: Additional non-sensitive ClickHouse configuration, stored as key-value pairs.
            type: map
            constraint:
              map:
                key:
                  type: string
                value:
                  type: string
          tags:
            description:
              zh_cn: 用于标注该 ClickHouse 存储的标签。
              en_us: Tags used to describe this ClickHouse storage.
            type: map
            constraint:
              map:
                key:
                  type: string
                value:
                  type: string

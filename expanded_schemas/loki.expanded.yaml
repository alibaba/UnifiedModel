description:
  zh_cn: Loki 存储，用于生成日志及日志派生指标的 LogQL 查询计划。
  en_us: Loki storage for LogQL query plans for logs and log-derived metrics.
name: loki
versions:
- name: v1.0.0
  spec:
    type: object
    properties:
      kind:
        type: string
        constraint:
          required: true
          enum:
            values:
            - loki
      schema:
        type: object
        properties:
          url:
            description:
              zh_cn: Schema 的 URL。Core 部分都为 "umodel.aliyun.com"
              en_us: The url of the schema. The Core part is "umodel.aliyun.com"
            type: string
            constraint:
              required: true
          version:
            description:
              zh_cn: Schema 的版本。命名格式为 "v1.2.3"。
              en_us: The version of the schema. The format is "v1.2.3".
            type: string
            constraint:
              required: true
        constraint:
          required: true
      metadata:
        type: object
        properties:
          name:
            description:
              zh_cn: 元素在 UModel 系统中的名称。值不能为空。值格式为小写字母数字字符。
              en_us: >-
                The name of the Element in UModel System. The value cannot be empty.The value format is lowercase alphanumeric
                characters.
            type: string
            constraint:
              pattern: ^[a-zA-Z][a-zA-Z0-9-_\.]{0,127}$
              required: true
              min_len: 0
              max_len: 128
          display_name:
            description:
              zh_cn: 元素在 UModel 系统中的显示名称。值不能为空。
              en_us: The display name of the Element in UModel System. The value cannot be empty.
            type: object
            properties:
              zh_cn:
                description:
                  zh_cn: 中文描述
                  en_us: Chinese description
                type: string
              en_us:
                description:
                  zh_cn: 英文描述
                  en_us: English description
                type: string
          description:
            description:
              zh_cn: 元素在 UModel 系统中的描述。
              en_us: The description of the Element in UModel System.
            type: object
            properties:
              zh_cn:
                description:
                  zh_cn: 中文描述
                  en_us: Chinese description
                type: string
              en_us:
                description:
                  zh_cn: 英文描述
                  en_us: English description
                type: string
          short_description:
            description:
              zh_cn: 元素在 UModel系统中的简短描述。
              en_us: The short description of the Element in UModel System.
            type: object
            properties:
              zh_cn:
                description:
                  zh_cn: 中文描述
                  en_us: Chinese description
                type: string
              en_us:
                description:
                  zh_cn: 英文描述
                  en_us: English description
                type: string
          domain:
            description:
              zh_cn: 域。值格式为'domain.domain'。可以以点连接。
              en_us: >-
                The domain of the Field. The value format is 'domain.domain'. it can be connected in the form of a dot.
            type: string
            constraint:
              pattern: ^[A-Za-z][a-zA-Z0-9-_\\.]*$
              required: true
              min_len: 0
              max_len: 128
          launch_stage:
            description:
              zh_cn: 元素的发布阶段。默认值为 preview。
              en_us: The launch stage of the Element. The default value is preview.
            type: string
            constraint:
              enum:
                values:
                - preview
                - beta
                - ga
                - deprecated
              default_value: preview
          icon:
            description:
              zh_cn: 元素在UModel系统中的图标。值格式为'url'。
              en_us: The icon of the Element in UModel System. The value format is 'url'.
            type: string
            release_stage: experimental
            constraint: null
          uri:
            description:
              zh_cn: 用于表示该元素唯一标识。
              en_us: This field is used to represent the unique identifier of the Element.
            type: string
            release_stage: experimental
            constraint: null
          tags:
            description:
              zh_cn: 用于表示该元素的标签。
              en_us: This field is used to represent the tags of the Element.
            type: map
            constraint:
              map:
                min_size: 1
                key:
                  type: string
                  constraint: null
                value:
                  type: string
          properties:
            description:
              zh_cn: 用于表示该元素的附加属性。
              en_us: This field is used to represent the additional properties of the Element.
            type: map
            constraint:
              map:
                key:
                  type: string
                  constraint: null
                value:
                  type: string
          common_schema_info:
            type: object
            description:
              zh_cn: >
                背景：在阿里云可观测业务使用中，内置的UModel数据会作为公共UModel（CommonSchema）默认存在，公共UModel数据以引用方式（CommonSchemaRef）配置在UModel，在查询时动态生成UModel实例并附加该字段作为额外说明。
                使用方式：该字段不需要手动配置，仅供查看。若存在该字段，则说明对应的UModel实例只可查看，不支持编辑或删除；若不存在该字段，则可根据业务需求按需编辑。
              en_us: >
                Background: In the use of Alibaba Cloud Observability business, the built-in UModel data will be defaulted
                as a common UModel (CommonSchema), and the common UModel data will be configured as a reference (CommonSchemaRef)
                in the UModel. When querying, a UModel instance will be dynamically generated and the field will be added
                as an additional description.  Usage: This field does not need to be manually configured, and is only for
                viewing. If this field exists, it means that the corresponding UModel instance can only be viewed, and editing
                or deletion is not supported; if this field does not exist, it can be edited according to business needs.
            properties:
              group:
                type: string
                description:
                  zh_cn: CommonSchema的Group信息
                  en_us: The group of the common schema
              version:
                type: string
                description:
                  zh_cn: CommonSchema的版本号
                  en_us: The version of the common schema
        constraint:
          required: true
      spec:
        type: object
        constraint:
          required: true
        description:
          zh_cn: Loki 查询计划配置。凭据值由调用方在执行时从环境变量读取。
          en_us: >-
            Loki query-plan configuration. The caller reads credential values from environment variables at execution time.
        properties:
          endpoint:
            type: string
            description:
              zh_cn: Loki 服务的 HTTP 或 HTTPS 地址。
              en_us: HTTP or HTTPS URL of the Loki service.
            constraint:
              required: true
          api_prefix:
            type: string
            description:
              zh_cn: Loki HTTP API 前缀，默认 /loki/api/v1。
              en_us: Loki HTTP API prefix; defaults to /loki/api/v1.
            constraint:
              default_value: /loki/api/v1
          default_query_type:
            type: string
            description:
              zh_cn: 指标查询的默认模式。
              en_us: Default mode for metric queries.
            constraint:
              enum:
                values:
                - instant
                - range
              default_value: instant
          default_step:
            type: string
            description:
              zh_cn: 区间指标查询的默认采样步长，例如 30s。
              en_us: Default step for range metric queries, for example 30s.
          search_filter:
            type: string
            description:
              zh_cn: 使用 Loki 标签名表达的可选静态过滤条件。
              en_us: Optional static filter expressed with Loki label names.
          default_size:
            type: integer
            description:
              zh_cn: 日志查询未指定 limit 时的默认条数，默认 100。
              en_us: Default log entry limit when none is specified; defaults to 100.
            constraint:
              default_value: 100
          max_size:
            type: integer
            description:
              zh_cn: 单次日志查询的最大条数，默认 1000。
              en_us: Maximum log entries per query; defaults to 1000.
            constraint:
              default_value: 1000
          tenant:
            type: string
            description:
              zh_cn: 由客户端传递的可选租户 ID。
              en_us: Optional tenant ID sent by the client.
          tenant_header:
            type: string
            description:
              zh_cn: 租户 HTTP 头名称，默认 X-Scope-OrgID。
              en_us: Tenant HTTP header name; defaults to X-Scope-OrgID.
            constraint:
              default_value: X-Scope-OrgID
          auth:
            type: object
            description:
              zh_cn: 认证方式与环境变量名；不得存放凭据值。
              en_us: Authentication type and environment variable names; never credential values.
            properties:
              type:
                type: string
                constraint:
                  required: true
                  enum:
                    values:
                    - bearer
                    - basic
              token_env:
                type: string
              username_env:
                type: string
              password_env:
                type: string
          tls_verify:
            type: boolean
            description:
              zh_cn: 是否校验 TLS 证书，默认 true。
              en_us: Whether to verify TLS certificates; defaults to true.
            constraint:
              default_value: true
          headers:
            type: map
            description:
              zh_cn: 不包含认证凭据的附加 HTTP 头。
              en_us: Additional HTTP headers without authentication credentials.
            constraint:
              map:
                key:
                  type: string
                value:
                  type: string

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: model-server
  labels:
    app.kubernetes.io/name: umodel
    app.kubernetes.io/component: server
spec:
  serviceName: model-server
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: umodel
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umodel
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: model-server
          image: umodel-open-source:local
          imagePullPolicy: IfNotPresent
          args:
            - --addr
            - :8080
            - --data
            - /data
            - --graphstore
            - file.memory
            - --ui-dir
            - /app/ui
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: umodel
          app.kubernetes.io/component: server
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: csi-disk-ssd
        resources:
          requests:
            storage: 50Gi

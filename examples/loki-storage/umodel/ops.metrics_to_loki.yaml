kind: storage_link
schema:
  url: umodel.aliyun.com
  version: v1.0.0
metadata:
  name: ops.metrics_to_loki
  domain: ops
  display_name:
    en_us: Log metrics in Loki
    zh_cn: Loki 中的日志指标
spec:
  src:
    domain: ops
    kind: metric_set
    name: ops.node.metrics
  dest:
    domain: ops
    kind: loki
    name: ops.loki
  fields_mapping:
    node_id: host
    environment: env
